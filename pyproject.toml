[project]
name = "crowdeval"
version = "0.1.0"
description = "Evaluating synthetic-consumer approaches against real people on Twin-2K-500"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "huggingface-hub>=0.26",
  "openpyxl>=3.1",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "tabulate>=0.9",
  "google-genai>=1.0",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowdeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
